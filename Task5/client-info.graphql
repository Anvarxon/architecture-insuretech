"""
GraphQL schema for client-info.
It covers the REST operations:
- GET /clients/{id}
- GET /clients/{id}/documents
- GET /clients/{id}/relatives
"""

schema {
  query: Query
}

scalar Date

type Query {
  client(id: ID!): Client
  clientDocuments(clientId: ID!): [Document!]!
  clientRelatives(clientId: ID!): [Relative!]!
}

type Client {
  id: ID!
  name: String!
  age: Int
  documents: [Document!]!
  relatives: [Relative!]!
}

type Document {
  id: ID!
  type: String!
  number: String!
  issueDate: Date
  expiryDate: Date
}

type Relative {
  id: ID!
  relationType: String!
  name: String!
  age: Int
}
